name: Deploy Babysitter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: babysitter-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://front.sitter.ge' }}
          STRAPI_URL: ${{ vars.STRAPI_URL || 'http://localhost:1337' }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
          SITE_URL: https://sitter.ge
          SITE_NAME: Babysitter
          SITE_CONFIG: sitter
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL" || { echo "Missing production variable API_BASE_URL"; exit 1; }
          npm ci
          npm run build
          test -f .output/server/index.mjs

      - name: Package release and runtime environment
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://front.sitter.ge' }}
          STRAPI_URL: ${{ vars.STRAPI_URL || 'http://localhost:1337' }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/babysitter-release"
          tar -czf "$RUNNER_TEMP/babysitter-release/release.tar.gz" .output
          {
            printf '%s\n' 'NODE_ENV=production' 'HOST=127.0.0.1' 'PORT=3001'
            printf 'NUXT_STRAPI_URL=%s\n' "$STRAPI_URL"
            printf 'NUXT_STRAPI_API_TOKEN=%s\n' "$STRAPI_API_TOKEN"
            printf 'NUXT_PUBLIC_API_BASE_URL=%s\n' "$API_BASE_URL"
            printf '%s\n' 'NUXT_PUBLIC_SITE_URL=https://sitter.ge' 'NUXT_PUBLIC_SITE_NAME=Babysitter'
          } > "$RUNNER_TEMP/babysitter-release/babysitter.env"
          chmod 600 "$RUNNER_TEMP/babysitter-release/babysitter.env"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo "Missing DEPLOY_SSH_PRIVATE_KEY secret"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing DEPLOY_KNOWN_HOSTS variable"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/babysitter_deploy
          chmod 600 ~/.ssh/babysitter_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          ssh -i ~/.ssh/babysitter_deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /var/www/babysitter-ci/incoming/$GITHUB_SHA"
          scp -i ~/.ssh/babysitter_deploy -P "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/babysitter-release/release.tar.gz" "$RUNNER_TEMP/babysitter-release/babysitter.env" \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/babysitter-ci/incoming/$GITHUB_SHA/"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/babysitter_deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/babysitter-deploy $GITHUB_SHA"
